plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly files("libs/weaponsexpanded_26.3_2.1.2.2_fabric.jar")
    compileOnly files("libs/expanded_weaponry-1.0.3-26.2.jar")
    compileOnly files("libs/kielsons-api-1.3.1-26.2.jar")
    compileOnly files("libs/bettercombat-fabric-3.2.2+26.3.jar")
    compileOnly files("libs/spell_engine-fabric-1.10.9+26.3.jar")
    compileOnly files("libs/spell_power-fabric-1.6.2+26.3.jar")
    compileOnly files("libs/combat_roll-fabric-3.0.1+26.3.jar")
    compileOnly files("libs/enderscape-fabric-3.0.6+mc26.3.jar")
    compileOnly files("libs/wthit-26.3-fabric-21.0.0.jar")
    compileOnly files("libs/jei-26.3-fabric-31.17.0.113.jar")
    compileOnly files("libs/aerialhell-0.7.9_fabric26.3.jar")
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

processResources {
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "version": project.mod_version
    }
    // inline each pose file's top "vars" block into its "$name" references
    filesMatching("assets/*/player_animations/*.json") {
        def vars = [:]
        def inVars = false
        filter { line ->
            if (line.trim() == '"vars": {') {
                inVars = true
                return null
            }
            if (inVars) {
                if (line.trim().startsWith("}")) {
                    inVars = false
                    return null
                }
                def m = line =~ /"(\w+)":\s*(-?[\d.]+)/
                vars[m[0][1]] = m[0][2]
                return null
            }
            line.replaceAll(/"\$(\w+)"/) { all, name -> vars[name] }
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Fails the build when a helper class sits in a mixin package.
def checkMixinPackages = tasks.register('checkMixinPackages', Exec) {
    dependsOn tasks.named('jar')
    doFirst {
        commandLine 'python3',
                "$projectDir/gradle/scripts/check-mixin-packages.py",
                tasks.named('jar').get().archiveFile.get().asFile
    }
}

tasks.named('build') { dependsOn checkMixinPackages }
